<script>

// Auf Vercel/Webserver läuft alles über den Proxy /api/sdui (wegen CORS), lokal als Datei direkt.

let me=null;
const $=s=>document.querySelector(s);

function clean(h){
  const d=new DOMParser().parseFromString(h||"","text/html");
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(n=>n.remove());
  d.body.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name);});if(n.tagName==="A"){n.target="_blank";n.rel="noopener";}});
  return d.body.innerHTML;
}
/* Dateien/Bilder brauchen den Token -> mit Authorization laden und als Blob anzeigen */
async function authSrc(u){
  const url=new URL(u,BASE);
  if(url.hostname!=="api.sdui.app")return url.href;
  const r=await fetch(PROXY?PROXY+encodeURIComponent(url.href):url.href,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const bl=await r.blob();if(/json/.test(bl.type))throw new Error("Keine Datei");return URL.createObjectURL(bl);
}
function dlFile(u,name){
  authSrc(u).then(h=>{const a=document.createElement("a");a.href=h;a.download=name||"";a.target="_blank";document.body.appendChild(a);a.click();a.remove();}).catch(e=>alert("Download fehlgeschlagen: "+e.message));
}
function hydrate(){
  document.querySelectorAll("img[data-src]:not([data-h])").forEach(async i=>{
    i.dataset.h=1;let ok=false;
    for(const u of [i.dataset.src,i.dataset.alt]){
      if(!u)continue;
      try{i.src=await authSrc(u);i.style.cursor="zoom-in";i.onclick=()=>openLB(i);ok=true;break;}catch(_){}
    }
    if(!ok)i.replaceWith(Object.assign(document.createElement("span"),{className:"mu",textContent:"Bild konnte nicht geladen werden"}));
  });
}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-dl]");if(a){e.preventDefault();dlFile(a.dataset.dl,a.dataset.name);}});
function ic(n){return `<svg class="ic" viewBox="0 0 24 24">${ICONS[n]||""}</svg>`}
const NAVIC={news:"news",timetable:"cal",chats:"chat",cloud:"cloud",courses:"cap",profile:"user"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path,{method="GET",params,body}={}){
  const u=new URL(path,BASE);
  if(params)Object.entries(params).forEach(([k,v])=>v!=null&&v!==""&&u.searchParams.set(k,v));
  const r=await fetch(PROXY?PROXY+encodeURIComponent(u.href):u,{method,headers:{"Accept":"application/json",...(body instanceof FormData?{}:{"Content-Type":"application/json"}),...(token&&{Authorization:"Bearer "+token})},body:body?(body instanceof FormData?body:JSON.stringify(body)):undefined});
  if(r.status===401&&token){logout();throw new Error("Sitzung abgelaufen");}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.meta&&j.meta.errors&&j.meta.errors[0])||j.message||(r.status===401?"Benutzername oder Passwort falsch.":"Fehler "+r.status));
  return j.data;
}
const api_ = {
  login:(slink,identifier,password)=>api("auth/login",{method:"POST",body:{slink,identifier,password,showErrors:true}}),
  user:()=>api("users/self"),
  news:page=>api("users/self/feed/news",{params:{page}}),
  times:()=>api("timetables/times"),
  timetable:(a,b)=>api("timetables/users/self/timetable",{params:{begins_at:a,ends_at:b}}),
  chats:(page,search,limit)=>api("users/self/channels/chats",{params:{page,search,limit:limit||15}}),
  members:id=>api(`channels/${id}/users`,{params:{page:1,search:""}}),
  files:(id,path,search)=>api(`channels/cloud/${id}/files`,{params:{path,search,limit:50,"order-by":"name","order-dir":"asc"}}),
  msgs:(id,page)=>api(`channels/chats/${id}/messages`,{params:{page}}),
  send:(id,content)=>api(`channels/chats/${id}/messages`,{method:"POST",body:{content}}),
  courses:()=>api("users/self/timetable/courses"),
  activity:()=>api("users/self/activity-summary"),
  newsById:id=>api("channels/news/"+id),
  classbook:(id,date)=>api(`timetables/lessons/${id}/classbook-entry`,{params:{date}}),
  vote:(id,vote)=>api(`channels/surveys/${id}/vote`,{method:"PUT",body:vote})
};

const pages={news:"News",timetable:"Stundenplan",chats:"Chats",cloud:"Cloud",courses:"Kurse",profile:"Profil"};
function buildNav(){
  $("#nav").innerHTML='<h2>Sdui Web</h2>'+Object.entries(pages).map(([k,v])=>`<a data-p="${k}">${ic(NAVIC[k])} ${v}</a>`).join("")+'<a id="out">'+ic("out")+' Abmelden</a>';
  $("#nav").onclick=e=>{const a=e.target.closest("a");if(!a)return;if(a.id==="out")return logout();go(a.dataset.p);};
  const TABS=[["news","News","news"],["timetable","Stunden","cal"],["chats","Chats","chat"],["more","Mehr","more"]];
  $("#tabbar").innerHTML=TABS.map(([k,l,i])=>`<a class="tab" data-t="${k}">${ic(i)}<span>${l}</span>${k==="chats"?'<i class="bd" hidden></i>':""}</a>`).join("");
  $("#tabbar").onclick=e=>{const a=e.target.closest(".tab");if(!a)return;a.dataset.t==="more"?openMore():go(a.dataset.t);};
}
function updateBadge(){api_.activity().then(a=>{const n=a.chat?.unread_count||0,b=document.querySelector(".tab .bd");if(b){b.textContent=n>99?"99+":n;b.hidden=!n;}}).catch(()=>{});}
function go(k){location.hash==="#"+k?route():location.hash=k;}
function route(){
  const p=(location.hash.slice(1)||"news").split("-")[0];
  document.querySelectorAll("nav a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===p||(t.dataset.t==="more"&&["cloud","courses","profile"].includes(p))));
  document.body.classList.remove("inchat");
  if(me)updateBadge();
  if(p==="chats"&&location.hash==="#chats-new")return newChat();
  if(p==="news"&&location.hash.length>6)return newsDetail(location.hash.slice(6));
  ({news,timetable,chats,cloud,courses,profile,notifications}[p]||news)();
}
window.addEventListener("hashchange",()=>token&&route());

function logout(){token="";localStorage.removeItem("sdui_token");$("#app").style.display="none";$("#login").style.display="block";}
async function start(){
  $("#login").style.display="none";$("#app").style.display="block";buildNav();
  try{me=await api_.user();}catch(e){return logout();}
  updateBadge();
  route();
}
$("#go").onclick=async()=>{
  $("#lerr").textContent="";
  if(!$("#slink").value.trim())return $("#lerr").textContent="Bitte zuerst deine Schule auswählen.";
  try{
    const d=await api_.login($("#slink").value.trim(),$("#ident").value.trim(),$("#pw").value);
    token=d.access_token;localStorage.setItem("sdui_token",token);$("#pw").value="";start();
  }catch(e){$("#lerr").textContent=e.message==="Failed to fetch"?"Netzwerk/CORS-Fehler. Datei lokal öffnen oder CORS-Proxy nutzen.":e.message;}
};
const V=h=>$("#view").innerHTML=h;
const load=()=>{document.body.classList.remove("inchat");V('<div class="spin" role="status" aria-label="Lädt"></div>');};
const fail=e=>V(`<div class="card err">${esc(e.message)}</div>`);

/* NEWS */
let npage=1,NEWS=[];
const D2=t=>{const d=new Date(t);return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});};
const bodyOf=n=>n.content_rendered?clean(n.content_rendered):esc(n.content);
const grpOf=n=>(n.channels||[]).map(c=>c.meta?.displayname||c.name).filter(Boolean).join(", ")||"Alle";
function newsItem(n,i,o={}){
  const A=k=>o.live?` data-act="${k}"`:"",ti=o.title??n.title;
  return `<div class="card ncard" data-ni="${i}">${n.is_pinned?`<div class="pinl">${ic("pin")} Vom Autor fixiert <a href="#"${A("pin")}>Was heißt das?</a></div>`:""}
  <div class="nhead"><div class="chips"><span class="chip a">${esc(n.user?.meta?.displayname||"")}</span>${ic("right")}<span class="chip">${esc(grpOf(n))}</span></div>
  <div class="nact"><button class="flagb"${A("tr")} aria-label="Übersetzen"><span class="flag"></span></button><div class="mw"><button class="ib"${A("more")} aria-label="Mehr">${ic("more")}</button>${o.live?`<div class="menu mm" hidden><div class="mi" data-nm="copy">${ic("copy")}<span>Link kopieren</span></div><div class="mi" data-nm="detail">${ic("news")}<span>Zur News Detailseite</span></div></div>`:""}</div></div></div>
  <div class="mu">${D2(n.publish_at||n.created_at)}</div>
  ${ti?`<h3 style="margin:8px 0">${esc(ti)}</h3>`:""}<div class="news-body">${o.html??bodyOf(n)}</div>${attHtml(n.attachments)}${n.survey?surveyHtml(n.survey):""}</div>`;
}
async function news(){
  load();
  try{
    npage=1;NEWS=await api_.news(1);
    const mi=[["user","Account & Einstellungen","profile"],["group","Meine Gruppen","courses"],["user","Account wechseln","out"],["out","Ausloggen","out"]];
    V(`<div class="ph sticky"><h2>News</h2><div class="row" style="gap:0"><button class="ib gr" data-act="bell" aria-label="Benachrichtigungen">${ic("bell")}<i class="bd" id="bellb" hidden></i></button><button class="ib gr" data-act="info" aria-label="Info">${ic("info")}</button>
      <div class="mw"><button class="ib gr" data-act="menu" aria-label="Menü">${ic("menu")}</button><div class="menu" id="menu" hidden>${mi.map(([i,t,g],k)=>`<div class="mi${k===3?" rd":""}" data-mg="${g}">${ic(i)}<span>${t}</span></div>`).join("")}</div></div></div></div>
      <label class="sbox">${ic("search")}<input id="ns" placeholder="News suchen" autocomplete="off"></label>`+
      `<div id="nl">${NEWS.map((n,i)=>newsItem(n,i,{live:1})).join("")}</div>`+(NEWS.length?"":'<p class="mu">Keine News.</p>')+'<div id="nmore"></div>');
    const filt=()=>{const q=($("#ns").value||"").trim().toLowerCase();document.querySelectorAll(".ncard").forEach(c=>c.hidden=!!q&&!c.textContent.toLowerCase().includes(q));};
    $("#ns").oninput=filt;
    const mo=$("#nmore");let busy=false,done=!NEWS.length;
    const io=new IntersectionObserver(async es=>{
      if(!es[0].isIntersecting||busy||done)return;busy=true;mo.innerHTML='<div class="spin s"></div>';
      try{
        const more=await api_.news(++npage),ids=new Set(NEWS.map(x=>x.id??x.uuid)),add=more.filter(x=>!ids.has(x.id??x.uuid));
        if(!add.length)done=true;else{const base=NEWS.length;NEWS.push(...add);$("#nl").insertAdjacentHTML("beforeend",add.map((n,i)=>newsItem(n,base+i,{live:1})).join(""));filt();}
      }catch(_){done=true;}
      mo.innerHTML="";busy=false;if(!done){io.unobserve(mo);io.observe(mo);}
    },{rootMargin:"400px"});
    io.observe(mo);
    api_.activity().then(a=>{if(a.notification?.unread_count){const b=$("#bellb");if(b)b.hidden=false;}}).catch(()=>{});
  }catch(e){fail(e);}
}
document.addEventListener("click",e=>{
  const own=e.target.closest(".mw");
  document.querySelectorAll(".menu").forEach(x=>{if(x.parentNode!==own)x.hidden=true;});
  const g=e.target.closest("[data-mg]");if(g){g.dataset.mg==="out"?logout():go(g.dataset.mg);return;}
  const nm=e.target.closest("[data-nm]");
  if(nm){
    const n=NEWS[+nm.closest(".ncard").dataset.ni];nm.closest(".menu").hidden=true;if(!n)return;
    const id=n.id??n.uuid;
    if(nm.dataset.nm==="detail")location.hash="news-"+id;
    else{const u=location.origin+location.pathname+"#news-"+id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert("Link kopiert")).catch(()=>prompt("Link kopieren:",u));}
    return;
  }
  const cm=e.target.closest("[data-cm]");
  if(cm){cm.closest(".menu").hidden=true;chatAct(cm.dataset.cm,cm.closest(".chat").dataset.c);return;}
  const cf=e.target.closest("[data-cf]");
  if(cf){cf.closest(".menu").hidden=true;const k=cf.dataset.cf;
    if(k==="soon")alert("Diese Ansicht ist noch nicht eingebaut.");
    else{const was=sessionStorage.getItem("carch");sessionStorage.removeItem("cfu");sessionStorage.removeItem("carch");if(k==="unread")sessionStorage.setItem("cfu","1");if(k==="arch"&&!was)sessionStorage.setItem("carch","1");chats();}
    return;}

async function trApi(q,target){
  if(!PROXY)throw new Error("Übersetzen funktioniert nur über den Vercel-Proxy (nicht als lokale Datei).");

}
async function trNews(n,lang){

function newsCard(n){
  if(n&&n.title)return `<div class="shared">${ic("news")} <b>${esc(n.title)}</b><div class="nbody">${n.content_rendered?clean(n.content_rendered):esc(n.content)}</div>${attHtml(n.attachments)}</div>`;

  return `<div class="shared">${ic("news")} <b>News nicht mehr verfügbar</b><br><span class="mu">Sie wurde gelöscht oder du hast keinen Zugriff.</span></div>`;
}
const HINTS={"news.posted":"hat eine News geteilt","introductions.conversation":"In dieser Konversation kann sicher kommuniziert werden."};
const isKey=t=>/^[a-z_]+(\.[a-z_]+)+$/.test(t||"");
const hintText=k=>HINTS[k]||"Systemnachricht";
const isDel=x=>!!(x&&(x.deleted_at||x.unset_at));
function previewOf(x){
  if(!x)return"";
  const who=x.user?.meta?.displayname||"";
  if(x.content==="news.posted"||x.target_type==="news")return(who?who+" ":"")+"hat eine News geteilt";
  if(isKey(x.content))return hintText(x.content);
  if(x.content)return x.content;
  if(x.file)return"📎 "+(x.file.name||"Datei");
  return"";
}
function msgHtml(x,mine){
  if(x.deleted_at||x.unset_at)return `<div class="del ${mine?"me":""}">Diese Nachricht wurde gelöscht</div>`;
  if(x.content==="introductions.conversation")return `<div class="intro">${esc(HINTS[x.content])}</div>`;
  let b="";
  if(x.target_type==="news"||x.content==="news.posted")b=newsCard(x.target);
  else if(x.type==="HINT"||isKey(x.content))b=`<i>${esc(hintText(x.content))}</i>`;
  else b=esc(x.content||"");
  const f=x.file,m=f?.meta||{};
  if(f)b+=(m.has_image||f.file_type==="image"||/^(jpe?g|png|gif|webp)$/i.test(f.extension||""))?`<img class="nimg" data-src="${esc(m.content_uri||m.uri||m.thumbnail_uri)}" data-alt="${esc(m.thumbnail_uri||m.download_uri||"")}" alt="${esc(f.name)}">`:fileHtml(f.name,f.extension,f.size??m.size,m.download_uri||m.uri);
  const t=new Date(x.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  return `<div class="msg ${mine?"me":""}">${mine?"":`<div class="who">${esc(x.user?.meta?.displayname||"")}</div>`}${b}<div class="tm">${t}</div></div>`;
}

        const th=m.has_image&&(m.thumbnail_uri||m.content_uri);
        return `<div class="crow" data-f="${i}"><div class="av" style="border-radius:12px;overflow:hidden">${th?`<img data-src="${esc(th)}" style="width:100%;height:100%;object-fit:cover">`:ic(dir?"folder":"file")}</div><div style="min-width:0"><b style="word-break:break-word">${esc(f.name)}</b><div class="mu">${dir?"Ordner":fsize(f.size||0)} · ${new Date(f.updated_at).toLocaleDateString("de-DE")}</div></div></div>`;}).join("")||'<p class="mu">Keine Dateien.</p>'));
    $("#cb_").onclick=()=>{if(cl.stack.length){cl.path=cl.stack.pop();}else cl.id=null;cloud();};
    $("#fs").onchange=e=>{sessionStorage.setItem("fq",e.target.value);cloud();};
    document.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{
      const f=fl[+el.dataset.f],m=f.meta||{};
      if(f.file_type==="folder"||f.type==="folder"||f.type==="directory"){cl.stack.push(cl.path);cl.path=m.absolute_path||f.path||f.name;cloud();}
      else dlFile(m.download_uri||m.uri||m.content_uri,f.name);
    });
  }catch(e){fail(e);}
}

/* COURSES */
async function courses(){
  load();
  try{
    const c=await api_.courses();
    V(`<h2>Kurse</h2>`+c.map(x=>`<div class="card"><b>${esc(x.meta?.displayname||x.name)}</b><br><span class="mu">${esc(x.description||"")}</span></div>`).join(""));
  }catch(e){fail(e);}
}

/* PROFILE */
async function profile(){
  load();
  try{
    const [u,a]=await Promise.all([api_.user(),api_.activity().catch(()=>null)]);
    V(`<h2>Profil</h2><div class="card"><h3 style="margin-top:0">${esc(u.meta?.displayname||u.firstname+" "+u.lastname)}</h3>
      <p class="mu">${esc(u.meta?.subtitle||"")}</p>
      <p>Schule: ${esc(u.school?.name)}<br>Klasse: ${esc(u.grade?.name||"–")}<br>Rolle: ${esc(u.primary_role?.name||u.type)}<br>E-Mail: ${esc(u.email||"–")}</p></div>
      ${a?`<div class="card"><b>Aktivität</b><p style="margin-bottom:0">${ic("chat")} Ungelesene Chats: <b>${a.chat?.unread_count??0}</b><br>${ic("bell")} Neue Benachrichtigungen: <b>${a.notification?.unread_count??0}</b></p></div>`:""}`);
  }catch(e){fail(e);}
}

/* SCHULSUCHE */
let st;
$("#sq").oninput=e=>{
  clearTimeout(st);const q=e.target.value.trim();
  if(q.length<3){$("#sres").innerHTML="";return;}
  $("#sres").innerHTML='<p class="mu">Suche …</p>';
  st=setTimeout(async()=>{
    try{
      const r=await api("leads",{params:{search:q}});
      $("#sres").innerHTML=(r.length?r.slice(0,8).map(s=>`<div class="card" style="cursor:pointer;padding:10px;margin-bottom:6px" data-sl="${esc(s.slink)}" data-n="${esc(s.name)}"><b>${esc(s.name)}</b><br><span class="mu">${esc(s.city||"")} ${esc(s.street||"")}</span></div>`).join(""):'<p class="mu">Keine Treffer.</p>');
    }catch(x){$("#sres").innerHTML=`<p class="err">${esc(x.message==="Failed to fetch"?"Netzwerk/CORS-Fehler. Datei lokal öffnen oder CORS-Proxy nutzen.":x.message)}</p>`;}
  },350);
};
$("#sres").onclick=e=>{
  const c=e.target.closest("[data-sl]");if(!c)return;
  $("#slink").value=c.dataset.sl;$("#sq").value=c.dataset.n;
  localStorage.setItem("sdui_slink",c.dataset.sl);localStorage.setItem("sdui_school",c.dataset.n);
  $("#sres").innerHTML=`<p class="mu">${ic("check")} Schule ausgewählt</p>`;
};

$("#ident").onkeydown=$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#go").click();};
new MutationObserver(hydrate).observe($("#view"),{childList:true,subtree:true});
$("#pwt").innerHTML=ic("eye");
$("#pwt").onclick=()=>{const p=$("#pw"),show=p.type==="password";p.type=show?"text":"password";$("#pwt").innerHTML=ic(show?"eyeoff":"eye");$("#pwt").setAttribute("aria-label",show?"Passwort verbergen":"Passwort anzeigen");};
if(localStorage.getItem("sdui_slink")){$("#slink").value=localStorage.getItem("sdui_slink");$("#sq").value=localStorage.getItem("sdui_school")||"";}
if(token)start();
</script>
