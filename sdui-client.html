<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sdui Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#1a1a1f;--mu:#6e6e78;--ac:#c9285f;--bd:#ebebef;--rd:#e5484d}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input{font:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:6px 0 12px}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
#login{max-width:380px;margin:10vh auto;padding:0 16px}
#app{display:none;min-height:100vh}
nav{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px}
nav h2{margin:4px 10px 14px;font-size:18px}
nav a{display:block;padding:10px 12px;border-radius:10px;color:var(--tx);cursor:pointer;margin-bottom:2px}
nav a.on{background:var(--ac);color:#fff}
main{margin-left:200px;padding:20px;max-width:900px}
.mu{color:var(--mu);font-size:13px}.err{color:var(--rd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tt .day{min-width:0}.tt h4{margin:0 0 6px;font-size:13px}
.les{border-left:4px solid var(--ac);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px}
.les.CANCLED{opacity:.55;text-decoration:line-through;border-color:var(--rd)}
.les.SUBSTITUTION{border-color:#f5a524}
.chat{cursor:pointer}.msg{padding:8px 12px;border-radius:12px;background:var(--bg);margin-bottom:6px;max-width:80%}
.msg.me{margin-left:auto;background:var(--ac);color:#fff}
.news-body img{max-width:100%}
@media(max-width:700px){nav{position:static;width:auto;display:flex;overflow:auto;border:0;padding:8px}nav h2{display:none}main{margin:0;padding:12px}.tt{grid-template-columns:1fr}}
body{font-family:'Poppins','Sofia Pro',system-ui,sans-serif}
.card{border:0;border-radius:20px;box-shadow:0 2px 12px rgba(20,20,40,.06);padding:18px 20px}
input{background:#f0f0f2;border:1px solid transparent;border-radius:14px;padding:12px 14px}
input:focus{outline:2px solid var(--ac);background:#fff}
.btn{border-radius:14px;font-weight:600}
nav{border-right:0;box-shadow:2px 0 14px rgba(20,20,40,.05)}
nav a{border-radius:14px;font-weight:500}
nav a.on{background:#fdecf2;color:var(--ac);font-weight:600}
h2{font-size:26px;margin:4px 0 14px}
.les{background:#f6f6f8}.msg{background:#fff;box-shadow:0 1px 6px rgba(20,20,40,.06)}
.nimg{max-width:100%;max-height:420px;border-radius:14px;display:block;margin:8px 0}
.shared{border-left:4px solid var(--ac);background:#fdf1f5;border-radius:10px;padding:8px 10px;margin-top:4px}
.msg.me .shared{background:rgba(255,255,255,.18);color:#fff;border-color:#fff}
.ic{width:1.1em;height:1.1em;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav a .ic{margin-right:6px;width:1.25em;height:1.25em;vertical-align:-.3em}
.nbody{max-height:150px;overflow:hidden;margin-top:4px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.pills{display:flex;gap:6px;overflow:auto;margin-bottom:14px}
.pill{border:0;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 6px rgba(20,20,40,.07);color:var(--tx)}
.pill.on{background:var(--ac);color:#fff}
.ls{display:flex;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:8px;box-shadow:0 2px 10px rgba(20,20,40,.06);cursor:pointer;border-left:6px solid var(--c)}
.ls.CANCLED{opacity:.6}.ls.CANCLED b{text-decoration:line-through}
.ls.SUBSTITUTION{background:#fff8ec}
.lt{display:flex;flex-direction:column;font-weight:600;min-width:46px;font-size:13px}.lt .mu{font-weight:400}
.lb{min-width:0;font-size:14px}
.badge{color:#fff;border-radius:999px;font-size:11px;padding:2px 8px;font-weight:600;vertical-align:middle}
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:.25s}
.sh-box{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:560px;max-height:85vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px 28px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.open{pointer-events:auto}#sheet.open .sh-bg{opacity:1}#sheet.open .sh-box{transform:none}
.sh-grab{width:44px;height:5px;border-radius:9px;background:#d8d8de;margin:0 auto 14px}
.sh-top{border-left:6px solid var(--c);padding-left:12px;margin-bottom:12px}.sh-top h3{margin:0 0 2px}
.srow{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.srow .ic{margin-top:3px;color:var(--mu)}
.gw{background:#fff;border-radius:20px;padding:12px;box-shadow:0 2px 12px rgba(20,20,40,.06);overflow-x:auto}
.gh,.gb{display:grid;grid-template-columns:42px repeat(5,minmax(0,1fr));gap:4px;min-width:480px}
.gh{margin-bottom:6px}.gd{text-align:center}.gd small{color:var(--mu);font-weight:600;font-size:11px;letter-spacing:.6px}
.gd b{display:block;font-size:20px;font-weight:500}.gd.today b{color:var(--ac);font-weight:700}
.gx{position:relative}.tk{position:absolute;right:4px;transform:translateY(-7px);font-size:11px;color:var(--mu)}
.gc{position:relative;background:repeating-linear-gradient(to bottom,#ececf0 0 1px,transparent 1px var(--hp))}
.blk{position:absolute;box-sizing:border-box;border-radius:8px;padding:4px 6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;line-height:1.25;font-size:11.5px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,#fff);border-left:4px solid var(--c)}
.blk b{font-size:13px}.blk.CANCLED{color:#8a8a94;background:#f1f1f3;border-color:#c9c9d1}.blk.CANCLED *{text-decoration:line-through}
.blk.SUBSTITUTION{outline:2px solid #f59e0b;outline-offset:-2px}
.qd{position:absolute;right:3px;top:3px}.qd .ic{width:13px;height:13px}
.ad{background:color-mix(in srgb,var(--c) 18%,#fff);color:var(--c);border-left:4px solid var(--c);border-radius:8px;padding:4px 6px;font-size:12px;font-weight:600;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabbar{display:none}
.bd{position:absolute;top:-3px;left:calc(50% + 4px);background:var(--ac);color:#fff;border-radius:999px;font-size:10px;font-style:normal;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-weight:600}
.srow.more{align-items:center;cursor:pointer;font-size:16px}
.cin{position:sticky;bottom:0;background:var(--bg);padding:8px 0}
@media(max-width:700px){
nav{display:none}
main{padding:14px 12px calc(88px + env(safe-area-inset-bottom));margin:0}
h2{font-size:22px}
#tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -2px 14px rgba(20,20,40,.08);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer;position:relative;font-weight:500}
.tab .ic{width:26px;height:26px;display:block;margin:0 auto 2px}.tab.on{color:var(--ac);font-weight:600}
.cin{bottom:calc(66px + env(safe-area-inset-bottom))}
.gw{padding:8px 4px}.gh,.gb{min-width:0;gap:2px;grid-template-columns:32px repeat(5,minmax(0,1fr))}
.blk{font-size:9.5px;padding:3px 4px;border-left-width:3px}.blk b{font-size:11px}.gd b{font-size:16px}.tk{font-size:9px}
.sh-box{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
}
.chead{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.ct{cursor:pointer;min-width:0}.ct b{display:block}.ct .mu{font-size:12px}
.av{width:40px;height:40px;border-radius:50%;background:#ececf0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#555;flex:none}
.av .ic{width:20px;height:20px}
.ib{border:0;background:transparent;color:var(--ac);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.ib .ic{width:22px;height:22px}.ib.pl{background:#fdecf2}
.crow{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 10px rgba(20,20,40,.06)}
.msg{border:1px solid #e1e1e6;box-shadow:none;border-radius:14px;padding:8px 12px;max-width:82%;margin-bottom:6px;word-break:break-word}
.msg.me{background:#fdecf2;color:var(--tx);border-color:#f6d3df;margin-left:auto}
.msg.me .shared{background:#fff;color:var(--tx);border-color:var(--ac)}
.who{color:var(--ac);font-weight:600;font-size:13px}.tm{text-align:right;font-size:11px;color:var(--mu)}
.dsep{text-align:center;margin:14px 0 8px}.dsep span{background:#e8e8ec;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--mu)}
.dsep.un span{background:#fdeede;color:#b45f06}
.del{display:table;border:1px solid #d9d9df;border-radius:12px;padding:8px 12px;color:var(--mu);font-size:13px;background:#fff;margin-bottom:6px}.del.me{margin-left:auto}
.cin{display:flex;gap:8px;align-items:center}.cin input:not([hidden]){flex:1;margin:0;border-radius:999px}
.fchip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:2px 4px 2px 12px;margin-bottom:6px;font-size:13px}.fchip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.inchat #tabbar{display:none}body.inchat .cin{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}body.inchat main{padding-bottom:12px}
input,button{font-size:16px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main{overflow-wrap:anywhere}
.news-body table,.nbody table{display:block;overflow:auto;max-width:100%}
.news-body iframe,.news-body video{max-width:100%}
.gb{margin-top:8px}
.btn.ghost:disabled{opacity:.4;cursor:default}
@supports(height:100dvh){#app{min-height:100dvh}.sh-box{max-height:85dvh}}
</style>
</head>
<body>
<div id="login"><div class="card">
<h2 style="margin-top:0">Sdui Web</h2>
<p class="mu">Inoffizieller Client. Nicht mit Sdui GmbH verbunden.</p>
<label>Schule suchen<input id="sq" placeholder="z. B. Franziskus Koblenz" autocomplete="off"></label>
<div id="sres"></div>
<label>Schul-Link (slink)<input id="slink" placeholder="wird bei Auswahl automatisch gesetzt"></label>
<label>Benutzername / E-Mail<input id="ident" autocomplete="username"></label>
<label>Passwort<input id="pw" type="password" autocomplete="current-password"></label>
<button class="btn" id="go">Anmelden</button>
<p id="lerr" class="err"></p>
<p class="mu">Tipp: Zugangsdaten bleiben nur in deinem Browser (Token in localStorage).</p>
</div></div>

<div id="app">
<nav id="nav"><h2>Sdui Web</h2></nav>
<main id="view"></main>
<div id="tabbar"></div>
</div>

<div id="sheet"><div class="sh-bg"></div><div class="sh-box"><div class="sh-grab"></div><div id="sh-c"></div></div></div>
<script>
const BASE="https://api.sdui.app/v1/";
// Auf Vercel/Webserver läuft alles über den Proxy /api/sdui (wegen CORS), lokal als Datei direkt.
const PROXY=location.protocol==="file:"?"":"/api/sdui?u=";
let token=localStorage.getItem("sdui_token")||"";
let me=null;
const $=s=>document.querySelector(s);

const ICONS={
pin:'<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
clip:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
news:'<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>',
lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
poll:'<path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
room:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
cap:'<path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
group:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'
};
function clean(h){
  const d=new DOMParser().parseFromString(h||"","text/html");
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(n=>n.remove());
  d.body.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name);});if(n.tagName==="A"){n.target="_blank";n.rel="noopener";}});
  return d.body.innerHTML;
}
/* Dateien/Bilder brauchen den Token -> mit Authorization laden und als Blob anzeigen */
async function authSrc(u){
  const url=new URL(u,BASE);
  if(url.hostname!=="api.sdui.app")return url.href;
  const r=await fetch(PROXY?PROXY+encodeURIComponent(url.href):url.href,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return URL.createObjectURL(await r.blob());
}
function dlFile(u,name){
  authSrc(u).then(h=>{const a=document.createElement("a");a.href=h;a.download=name||"";a.target="_blank";document.body.appendChild(a);a.click();a.remove();}).catch(e=>alert("Download fehlgeschlagen: "+e.message));
}
function hydrate(){
  document.querySelectorAll("img[data-src]:not([data-h])").forEach(async i=>{
    i.dataset.h=1;
    try{i.src=await authSrc(i.dataset.src);i.style.cursor="zoom-in";i.onclick=()=>window.open(i.src,"_blank");}
    catch(_){i.replaceWith(Object.assign(document.createElement("span"),{className:"mu",textContent:"Bild konnte nicht geladen werden"}));}
  });
}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-dl]");if(a){e.preventDefault();dlFile(a.dataset.dl,a.dataset.name);}});
function ic(n){return `<svg class="ic" viewBox="0 0 24 24">${ICONS[n]||""}</svg>`}
const NAVIC={news:"news",timetable:"cal",chats:"chat",cloud:"cloud",courses:"cap",profile:"user"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path,{method="GET",params,body}={}){
  const u=new URL(path,BASE);
  if(params)Object.entries(params).forEach(([k,v])=>v!=null&&v!==""&&u.searchParams.set(k,v));
  const r=await fetch(PROXY?PROXY+encodeURIComponent(u.href):u,{method,headers:{"Accept":"application/json",...(body instanceof FormData?{}:{"Content-Type":"application/json"}),...(token&&{Authorization:"Bearer "+token})},body:body?(body instanceof FormData?body:JSON.stringify(body)):undefined});
  if(r.status===401&&token){logout();throw new Error("Sitzung abgelaufen");}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.meta&&j.meta.errors&&j.meta.errors[0])||j.message||(r.status===401?"Benutzername oder Passwort falsch.":"Fehler "+r.status));
  return j.data;
}
const api_ = {
  login:(slink,identifier,password)=>api("auth/login",{method:"POST",body:{slink,identifier,password,showErrors:true}}),
  user:()=>api("users/self"),
  news:page=>api("users/self/feed/news",{params:{page}}),
  times:()=>api("timetables/times"),
  timetable:(a,b)=>api("timetables/users/self/timetable",{params:{begins_at:a,ends_at:b}}),
  chats:(page,search,limit)=>api("users/self/channels/chats",{params:{page,search,limit:limit||15}}),
  members:id=>api(`channels/${id}/users`,{params:{page:1,search:""}}),
  files:(id,path,search)=>api(`channels/cloud/${id}/files`,{params:{path,search,limit:50,"order-by":"name","order-dir":"asc"}}),
  msgs:(id,page)=>api(`channels/chats/${id}/messages`,{params:{page}}),
  send:(id,content)=>api(`channels/chats/${id}/messages`,{method:"POST",body:{content}}),
  courses:()=>api("users/self/timetable/courses"),
  activity:()=>api("users/self/activity-summary"),
  newsById:id=>api("channels/news/"+id),
  classbook:(id,date)=>api(`timetables/lessons/${id}/classbook-entry`,{params:{date}}),
  vote:(id,vote)=>api(`channels/surveys/${id}/vote`,{method:"PUT",body:vote})
};

const pages={news:"News",timetable:"Stundenplan",chats:"Chats",cloud:"Cloud",courses:"Kurse",profile:"Profil"};
function buildNav(){
  $("#nav").innerHTML='<h2>Sdui Web</h2>'+Object.entries(pages).map(([k,v])=>`<a data-p="${k}">${ic(NAVIC[k])} ${v}</a>`).join("")+'<a id="out">'+ic("out")+' Abmelden</a>';
  $("#nav").onclick=e=>{const a=e.target.closest("a");if(!a)return;if(a.id==="out")return logout();go(a.dataset.p);};
  const TABS=[["news","News","news"],["timetable","Stunden","cal"],["chats","Chats","chat"],["more","Mehr","more"]];
  $("#tabbar").innerHTML=TABS.map(([k,l,i])=>`<a class="tab" data-t="${k}">${ic(i)}<span>${l}</span>${k==="chats"?'<i class="bd" hidden></i>':""}</a>`).join("");
  $("#tabbar").onclick=e=>{const a=e.target.closest(".tab");if(!a)return;a.dataset.t==="more"?openMore():go(a.dataset.t);};
}
function updateBadge(){api_.activity().then(a=>{const n=a.chat?.unread_count||0,b=document.querySelector(".tab .bd");if(b){b.textContent=n>99?"99+":n;b.hidden=!n;}}).catch(()=>{});}
function go(k){location.hash==="#"+k?route():location.hash=k;}
function route(){
  const p=(location.hash.slice(1)||"news").split("-")[0];
  document.querySelectorAll("nav a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===p));

let weekOff=0,selDay=null,ttView="day",ttL=[];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const KIND={SUBSTITUTION:["Vertretung","#f59e0b"],CANCLED:["Entfall","#e5484d"],EVENT:["Event","#2f6bff"],BOOKABLE_CHANGE:["Raumänderung","#0ea5a4"],HOLIDAY:["Ferien","#8b5cf6"]};
const fmtT=t=>new Date(t*1000).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const lcol=l=>{let c=(l.course?.subject?.color||l.course?.meta?.color||"").replace("#","");if(c.length===3)c=[...c].map(x=>x+x).join("");return /^[0-9a-f]{6}/i.test(c)?"#"+c.slice(0,6):"#2f6bff"};
const isAllDay=l=>l.kind==="HOLIDAY"||(l.ends_at-l.begins_at)>=6*3600;
const lname=l=>l.meta?.displayname||l.course?.meta?.displayname||l.course?.subject?.name||l.course?.name||"Stunde";
const sh=(x,k)=>(x[k]||[]).map(t=>t.shortcut).join(", ");
const badge=k=>KIND[k]?`<span class="badge" style="background:${KIND[k][1]}">${KIND[k][0]}</span>`:"";
function lessonHtml(l,i){
  const o=(l.referenced_target_lessons||[])[0],t=sh(l,"teachers"),r=sh(l,"bookables"),ot=o?sh(o,"teachers"):"",or=o?sh(o,"bookables"):"";
  return `<div class="ls ${l.kind||""}" data-i="${i}" style="--c:${lcol(l)}"><div class="lt">${fmtT(l.begins_at)}<span class="mu">${fmtT(l.ends_at)}</span></div><div class="lb"><div><b>${esc(lname(l))}</b> ${badge(l.kind)}</div>

  ${o&&lname(o)!==lname(l)?`<div class="mu">statt <s>${esc(lname(o))}</s></div>`:""}${l.comment?`<div class="mu">${esc(l.comment)}</div>`:""}</div></div>`;
}
async function timetable(){
  load();
  const now=new Date(),dow=(now.getDay()+6)%7;
  const mon=new Date(now);mon.setDate(now.getDate()-dow+weekOff*7);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  try{
    const t=await api_.timetable(iso(mon),iso(fri));
    ttL=(t.lessons||[]).sort((x,y)=>x.begins_at-y.begins_at);
    if(selDay===null)selDay=weekOff===0?Math.min(dow,4):0;
    drawTT(mon,t.last_updated_at);
  }catch(e){fail(e);}
}
function blockHtml(c,a,P){
  const l=c.l,t=sh(l,"teachers"),r=sh(l,"bookables");
  return `<div class="blk ${l.kind||""}" data-i="${c.ix}" style="--c:${lcol(l)};top:${(c.s-a)*P}px;height:${Math.max((c.e-c.s)*P-2,24)}px;left:${c.lane*100/c.n}%;width:calc(${100/c.n}% - 2px)"><b>${esc(lname(l))}</b>${l.comment?`<span class="qd">${ic("info")}</span>`:""}<span>${esc(t)}</span><span>${esc(r)}</span></div>`;
}
function drawTT(mon,upd){
  const now=new Date(),mins=t=>{const d=new Date(t*1000);return d.getHours()*60+d.getMinutes()};
  const days=["MO","DI","MI","DO","FR"].map((n,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const all=[],ls=[];
    ttL.forEach((l,ix)=>{if(new Date(l.begins_at*1000).toDateString()===d.toDateString())(isAllDay(l)?all:ls).push({l,ix,s:mins(l.begins_at),e:mins(l.ends_at)});});
    return{n,d,all,ls};});
  const L=days.flatMap(x=>x.ls);
  let a=L.length?Math.min(...L.map(c=>c.s)):480,b=L.length?Math.max(...L.map(c=>c.e)):900;
  a=Math.floor(a/60)*60;b=Math.ceil(b/60)*60;const P=1.15,H=(b-a)*P;
  const ticks=[];for(let m=a;m<=b;m+=60)ticks.push(`<div class="tk" style="top:${(m-a)*P}px">${String(m/60).padStart(2,"0")}:00</div>`);
  const col=x=>{
    const it=x.ls.slice().sort((p,q)=>p.s-q.s),out=[];let cl=[],end=0,lanes=[];
    const flush=()=>{const n=Math.max(...cl.map(c=>c.lane))+1;cl.forEach(c=>{c.n=n;out.push(c);});cl=[];lanes=[];end=0;};
    it.forEach(c=>{if(cl.length&&c.s>=end)flush();let k=lanes.findIndex(e=>e<=c.s);if(k<0){k=lanes.length;lanes.push(0);}lanes[k]=c.e;c.lane=k;cl.push(c);end=Math.max(end,c.e);});
    if(cl.length)flush();
    return out.map(c=>blockHtml(c,a,P)).join("");
  };
  const anyAll=days.some(x=>x.all.length);
  V(`<div class="row" style="justify-content:space-between"><h2>Stundenplan</h2><div class="row"><button class="btn ghost" id="pw_">${ic("left")}</button><button class="btn ghost" id="cw">Heute</button><button class="btn ghost" id="nw">${ic("right")}</button></div></div>
  <div class="gw"><div class="gh"><div class="gx"></div>${days.map(x=>`<div class="gd ${x.d.toDateString()===now.toDateString()?"today":""}"><small>${x.n}</small><b>${String(x.d.getDate()).padStart(2,"0")}</b></div>`).join("")}</div>
  ${anyAll?`<div class="gh"><div class="gx mu" style="font-size:10px">ganztägig</div>${days.map(x=>`<div>${x.all.map(c=>`<div class="ad" data-i="${c.ix}" style="--c:${(KIND[c.l.kind]||[])[1]||lcol(c.l)}">${esc(lname(c.l))}</div>`).join("")}</div>`).join("")}</div>`:""}
  <div class="gb" style="height:${H}px;--hp:${60*P}px"><div class="gx">${ticks.join("")}</div>${days.map(x=>`<div class="gc">${col(x)}</div>`).join("")}</div></div>
  <p class="mu">Stand: ${esc(upd?new Date(upd).toLocaleString("de-DE"):"")}</p>`);
  $("#pw_").onclick=()=>{weekOff--;timetable();};$("#nw").onclick=()=>{weekOff++;timetable();};$("#cw").onclick=()=>{weekOff=0;timetable();};
}

const HINTS={"news.posted":"hat eine News geteilt"};
function msgHtml(x,mine){
  if(x.deleted_at||x.unset_at)return `<div class="del ${mine?"me":""}">Diese Nachricht wurde gelöscht</div>`;
  let b="";
  if(x.target_type==="news"||x.content==="news.posted")b=newsCard(x.target);
  else if(x.type==="HINT"||/^[a-z_]+(\.[a-z_]+)+$/.test(x.content||""))b=`<i>${esc(HINTS[x.content]||x.content)}</i>`;
  else b=esc(x.content||"");

  if(f)b+=(m.has_image||f.file_type==="image"||/^(jpe?g|png|gif|webp)$/i.test(f.extension||""))?`<img class="nimg" data-src="${esc(m.content_uri||m.uri||m.thumbnail_uri)}" alt="${esc(f.name)}">`:`<div><a href="#" data-dl="${esc(m.download_uri||m.uri)}" data-name="${esc(f.name)}">${ic("clip")} ${esc(f.name)}</a></div>`;

        const th=m.has_image&&(m.thumbnail_uri||m.content_uri);
        return `<div class="crow" data-f="${i}"><div class="av" style="border-radius:12px;overflow:hidden">${th?`<img data-src="${esc(th)}" style="width:100%;height:100%;object-fit:cover">`:ic(dir?"folder":"file")}</div><div style="min-width:0"><b style="word-break:break-word">${esc(f.name)}</b><div class="mu">${dir?"Ordner":fsize(f.size||0)} · ${new Date(f.updated_at).toLocaleDateString("de-DE")}</div></div></div>`;}).join("")||'<p class="mu">Keine Dateien.</p>'));
    $("#cb_").onclick=()=>{if(cl.stack.length){cl.path=cl.stack.pop();}else cl.id=null;cloud();};
    $("#fs").onchange=e=>{sessionStorage.setItem("fq",e.target.value);cloud();};
    document.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{
      const f=fl[+el.dataset.f],m=f.meta||{};
      if(f.file_type==="folder"||f.type==="folder"||f.type==="directory"){cl.stack.push(cl.path);cl.path=m.absolute_path||f.path||f.name;cloud();}
      else dlFile(m.download_uri||m.uri||m.content_uri,f.name);
    });
  }catch(e){fail(e);}
}

/* COURSES */
async function courses(){
  load();
  try{
    const c=await api_.courses();
    V(`<h2>Kurse</h2>`+c.map(x=>`<div class="card"><b>${esc(x.meta?.displayname||x.name)}</b><br><span class="mu">${esc(x.description||"")}</span></div>`).join(""));
  }catch(e){fail(e);}
}

/* PROFILE */
async function profile(){
  load();
  try{
    const [u,a]=await Promise.all([api_.user(),api_.activity().catch(()=>null)]);
    V(`<h2>Profil</h2><div class="card"><h3 style="margin-top:0">${esc(u.meta?.displayname||u.firstname+" "+u.lastname)}</h3>
      <p class="mu">${esc(u.meta?.subtitle||"")}</p>
      <p>Schule: ${esc(u.school?.name)}<br>Klasse: ${esc(u.grade?.name||"–")}<br>Rolle: ${esc(u.primary_role?.name||u.type)}<br>E-Mail: ${esc(u.email||"–")}</p></div>
      ${a?`<div class="card"><b>Aktivität</b><p style="margin-bottom:0">${ic("chat")} Ungelesene Chats: <b>${a.chat?.unread_count??0}</b><br>${ic("bell")} Neue Benachrichtigungen: <b>${a.notification?.unread_count??0}</b></p></div>`:""}`);
  }catch(e){fail(e);}
}

/* SCHULSUCHE */
let st;
$("#sq").oninput=e=>{
  clearTimeout(st);const q=e.target.value.trim();
  if(q.length<3){$("#sres").innerHTML="";return;}
  $("#sres").innerHTML='<p class="mu">Suche …</p>';
  st=setTimeout(async()=>{
    try{
      const r=await api("leads",{params:{search:q}});
      $("#sres").innerHTML=(r.length?r.slice(0,8).map(s=>`<div class="card" style="cursor:pointer;padding:10px;margin-bottom:6px" data-sl="${esc(s.slink)}" data-n="${esc(s.name)}"><b>${esc(s.name)}</b><br><span class="mu">${esc(s.city||"")} ${esc(s.street||"")}</span></div>`).join(""):'<p class="mu">Keine Treffer.</p>');
    }catch(x){$("#sres").innerHTML=`<p class="err">${esc(x.message==="Failed to fetch"?"Netzwerk/CORS-Fehler. Datei lokal öffnen oder CORS-Proxy nutzen.":x.message)}</p>`;}
  },350);
};
$("#sres").onclick=e=>{
  const c=e.target.closest("[data-sl]");if(!c)return;
  $("#slink").value=c.dataset.sl;$("#sq").value=c.dataset.n;
  $("#sres").innerHTML=`<p class="mu">${ic("check")} Ausgewählt: ${esc(c.dataset.n)} (${esc(c.dataset.sl)})</p>`;
};

$("#ident").onkeydown=$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#go").click();};
new MutationObserver(hydrate).observe($("#view"),{childList:true,subtree:true});
if(token)start();
</script>
