<!DOCTYPE html>

<style>

.btn{background:var(--ac);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
#login{max-width:380px;margin:10vh auto;padding:0 16px}
#app{display:none;min-height:100vh}
nav{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px}

main{margin-left:200px;padding:20px;max-width:900px}
.mu{color:var(--mu);font-size:13px}.err{color:var(--rd)}

.tt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tt .day{min-width:0}.tt h4{margin:0 0 6px;font-size:13px}
.les{border-left:4px solid var(--ac);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px}
.les.CANCLED{opacity:.55;text-decoration:line-through;border-color:var(--rd)}
.les.SUBSTITUTION{border-color:#f5a524}
.chat{cursor:pointer}.msg{padding:8px 12px;border-radius:12px;background:var(--bg);margin-bottom:6px;max-width:80%}
.msg.me{margin-left:auto;background:var(--ac);color:#fff}

body{font-family:'Poppins','Sofia Pro',system-ui,sans-serif}

.bd{position:absolute;top:-3px;left:calc(50% + 4px);background:var(--ac);color:#fff;border-radius:999px;font-size:10px;font-style:normal;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-weight:600}
.srow.more{align-items:center;cursor:pointer;font-size:16px}
.cin{position:sticky;bottom:0;background:var(--bg);padding:8px 0}

main{padding:14px 12px calc(88px + env(safe-area-inset-bottom));margin:0}
h2{font-size:22px}
#tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -2px 14px rgba(20,20,40,.08);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}

.blk{font-size:9.5px;padding:3px 4px;border-left-width:3px}.blk b{font-size:11px}.gd b{font-size:16px}.tk{font-size:9px}

.av .ic{width:20px;height:20px}
.ib{border:0;background:transparent;color:var(--ac);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.ib .ic{width:22px;height:22px}.ib.pl{background:#fdecf2}
.crow{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 10px rgba(20,20,40,.06)}
.msg{border:1px solid #e1e1e6;box-shadow:none;border-radius:14px;padding:8px 12px;max-width:82%;margin-bottom:6px;word-break:break-word}

.who{color:var(--ac);font-weight:600;font-size:13px}.tm{text-align:right;font-size:11px;color:var(--mu)}
.dsep{text-align:center;margin:14px 0 8px}.dsep span{background:#e8e8ec;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--mu)}
.dsep.un span{background:#fdeede;color:#b45f06}
.del{display:table;border:1px solid #d9d9df;border-radius:12px;padding:8px 12px;color:var(--mu);font-size:13px;background:#fff;margin-bottom:6px}.del.me{margin-left:auto}
.cin{display:flex;gap:8px;align-items:center}.cin input:not([hidden]){flex:1;margin:0;border-radius:999px}

input,button{font-size:16px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main{overflow-wrap:anywhere}
.news-body table,.nbody table{display:block;overflow:auto;max-width:100%}
.news-body iframe,.news-body video{max-width:100%}
.gb{margin-top:8px}
.btn.ghost:disabled{opacity:.4;cursor:default}

.ph{display:flex;align-items:center;justify-content:space-between}

.mb select{width:100%;padding:12px 14px;border:0;border-radius:12px;background:#f0f0f2;font:inherit;margin-top:6px}

.irow{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}.irow .ic{flex:none;width:38px;height:38px;padding:9px;border-radius:50%;background:#fdecf2;color:var(--ac)}

body{background:#f6f6f8}
.lc{padding:28px 24px!important}.lc h1{font-size:26px;margin:16px 0 4px}
.logo span{display:flex;width:56px;height:56px;border-radius:18px;background:var(--ac);color:#fff;font-size:30px;font-weight:700;align-items:center;justify-content:center}
.lc label{display:block;font-weight:500;font-size:14px;margin-top:12px}.lc input:not([type=hidden]){margin:6px 0 4px}
.pwr{position:relative}.pwr input{padding-right:50px}.pwr .ib{position:absolute;right:4px;top:calc(50% + 1px);transform:translateY(-50%);color:var(--mu)}
.tab.on .ic{fill:color-mix(in srgb,var(--ac) 20%,transparent)}
nav a:hover:not(.on){background:#f3f3f6}

<body>
<div id="login"><div class="card lc">
<div class="logo"><span>S</span></div>
<h1>Willkommen</h1><p class="mu" style="margin-top:0">Melde dich bei deiner Schule an.</p>
<label>Schule<input id="sq" placeholder="Schule suchen, z. B. Franziskus Koblenz" autocomplete="off"></label>
<div id="sres"></div><input id="slink" type="hidden">
<label>Benutzername / E-Mail<input id="ident" autocomplete="username"></label>
<label>Passwort<div class="pwr"><input id="pw" type="password" autocomplete="current-password"><button type="button" class="ib" id="pwt" aria-label="Passwort anzeigen"></button></div></label>
<button class="btn" id="go" style="width:100%;margin-top:14px">Anmelden</button>
<p id="lerr" class="err"></p>
<p class="mu" style="font-size:12px">Inoffizieller Client, nicht mit der Sdui GmbH verbunden. Das Token bleibt nur in deinem Browser.</p>
</div></div>

<div id="app">
<nav id="nav"><h2>Sdui Web</h2></nav>
<main id="view"></main>
<div id="tabbar"></div>
</div>

<div id="sheet"><div class="sh-bg"></div><div class="sh-box"><div class="sh-grab"></div><div id="sh-c"></div></div></div>

function clean(h){
  const d=new DOMParser().parseFromString(h||"","text/html");
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(n=>n.remove());
  d.body.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name);});if(n.tagName==="A"){n.target="_blank";n.rel="noopener";}});
  return d.body.innerHTML;
}
/* Dateien/Bilder brauchen den Token -> mit Authorization laden und als Blob anzeigen */
async function authSrc(u){
  const url=new URL(u,BASE);
  if(url.hostname!=="api.sdui.app")return url.href;
  const r=await fetch(PROXY?PROXY+encodeURIComponent(url.href):url.href,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return URL.createObjectURL(await r.blob());
}
function dlFile(u,name){
  authSrc(u).then(h=>{const a=document.createElement("a");a.href=h;a.download=name||"";a.target="_blank";document.body.appendChild(a);a.click();a.remove();}).catch(e=>alert("Download fehlgeschlagen: "+e.message));
}
function hydrate(){
  document.querySelectorAll("img[data-src]:not([data-h])").forEach(async i=>{
    i.dataset.h=1;
    try{i.src=await authSrc(i.dataset.src);i.style.cursor="zoom-in";i.onclick=()=>window.open(i.src,"_blank");}
    catch(_){i.replaceWith(Object.assign(document.createElement("span"),{className:"mu",textContent:"Bild konnte nicht geladen werden"}));}
  });
}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-dl]");if(a){e.preventDefault();dlFile(a.dataset.dl,a.dataset.name);}});
function ic(n){return `<svg class="ic" viewBox="0 0 24 24">${ICONS[n]||""}</svg>`}

async function api(path,{method="GET",params,body}={}){
  const u=new URL(path,BASE);
  if(params)Object.entries(params).forEach(([k,v])=>v!=null&&v!==""&&u.searchParams.set(k,v));
  const r=await fetch(PROXY?PROXY+encodeURIComponent(u.href):u,{method,headers:{"Accept":"application/json",...(body instanceof FormData?{}:{"Content-Type":"application/json"}),...(token&&{Authorization:"Bearer "+token})},body:body?(body instanceof FormData?body:JSON.stringify(body)):undefined});
  if(r.status===401&&token){logout();throw new Error("Sitzung abgelaufen");}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.meta&&j.meta.errors&&j.meta.errors[0])||j.message||(r.status===401?"Benutzername oder Passwort falsch.":"Fehler "+r.status));
  return j.data;
}

/* Übersetzen (Google Translate über /api/translate) */
const LANGS=[["en","Englisch (Britisch)"],["fr","Französisch"],["es","Spanisch"],["it","Italienisch"],["tr","Türkisch"],["ar","Arabisch"],["ru","Russisch"],["uk","Ukrainisch"],["pl","Polnisch"],["ro","Rumänisch"],["fa","Persisch"],["zh-CN","Chinesisch"]];
const TRC={};
async function trApi(q,target){
  if(!PROXY)throw new Error("Übersetzen funktioniert nur über den Vercel-Proxy (nicht als lokale Datei).");
  const r=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q,target})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||"Übersetzung fehlgeschlagen");
  return j.translations;
}
async function trNews(n,lang){
  const k=(n.id||n.uuid)+lang;if(TRC[k])return TRC[k];
  const d=new DOMParser().parseFromString(bodyOf(n),"text/html"),ns=[],w=document.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
  while(w.nextNode())if(w.currentNode.nodeValue.trim())ns.push(w.currentNode);
  const out=await trApi([n.title||"",...ns.map(x=>x.nodeValue)],lang);
  ns.forEach((x,i)=>x.nodeValue=out[i+1]);
  return TRC[k]={title:out[0],html:d.body.innerHTML};
}
function trModal(n){
  let lang=localStorage.getItem("sdui_lang")||"en",tab="tr";
  const show=async()=>{
    const box=$("#trb");box.innerHTML='<p class="mu" style="text-align:center">Übersetze …</p>';
    try{
      if(tab==="tr"){const t=await trNews(n,lang);box.dir=["ar","fa"].includes(lang)?"rtl":"ltr";box.innerHTML=newsItem(n,0,{title:t.title,html:t.html});}
      else{box.dir="ltr";box.innerHTML=newsItem(n,0);}
      hydrate();
    }catch(e){box.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
  };
  modal("Übersetzen",`<label class="mu" style="font-size:12px">SPRACHE / LANGUAGE</label><select id="trl">${LANGS.map(([c,t])=>`<option value="${c}"${c===lang?" selected":""}>${t}</option>`).join("")}</select>
    <div class="tabs"><button class="on" data-tb="tr">Übersetzung</button><button data-tb="orig">Original</button></div><div id="trb"></div>
    <p class="mu" style="text-align:center;font-size:12px;margin-top:16px">Automatische Übersetzung: Bitte Originaltext beachten, um Missverständnisse zu vermeiden.</p>`);
  $("#trl").onchange=e=>{lang=e.target.value;localStorage.setItem("sdui_lang",lang);tab="tr";document.querySelectorAll("[data-tb]").forEach(x=>x.classList.toggle("on",x.dataset.tb==="tr"));show();};
  document.querySelectorAll("[data-tb]").forEach(x=>x.onclick=()=>{tab=x.dataset.tb;document.querySelectorAll("[data-tb]").forEach(y=>y.classList.toggle("on",y===x));show();});
  show();
}

/* TIMETABLE */
let weekOff=0,selDay=null,ttView="day",ttL=[];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const KIND={SUBSTITUTION:["Vertretung","#f59e0b"],CANCLED:["Entfall","#e5484d"],EVENT:["Event","#2f6bff"],BOOKABLE_CHANGE:["Raumänderung","#0ea5a4"],HOLIDAY:["Ferien","#8b5cf6"]};
const fmtT=t=>new Date(t*1000).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const lcol=l=>{let c=(l.course?.subject?.color||l.course?.meta?.color||"").replace("#","");if(c.length===3)c=[...c].map(x=>x+x).join("");return /^[0-9a-f]{6}/i.test(c)?"#"+c.slice(0,6):"#2f6bff"};
const isAllDay=l=>l.kind==="HOLIDAY"||(l.ends_at-l.begins_at)>=6*3600;
const lname=l=>l.meta?.displayname||l.course?.meta?.displayname||l.course?.subject?.name||l.course?.name||"Stunde";
const sh=(x,k)=>(x[k]||[]).map(t=>t.shortcut).join(", ");
const badge=k=>KIND[k]?`<span class="badge" style="background:${KIND[k][1]}">${KIND[k][0]}</span>`:"";
function lessonHtml(l,i){
  const o=(l.referenced_target_lessons||[])[0],t=sh(l,"teachers"),r=sh(l,"bookables"),ot=o?sh(o,"teachers"):"",or=o?sh(o,"bookables"):"";
  return `<div class="ls ${l.kind||""}" data-i="${i}" style="--c:${lcol(l)}"><div class="lt">${fmtT(l.begins_at)}<span class="mu">${fmtT(l.ends_at)}</span></div><div class="lb"><div><b>${esc(lname(l))}</b> ${badge(l.kind)}</div>
  <div class="mu">${ic("user")} ${esc(t||"–")}${ot&&ot!==t?` <s>${esc(ot)}</s>`:""} &nbsp;${ic("room")} ${esc(r||"–")}${or&&or!==r?` <s>${esc(or)}</s>`:""}</div>
  ${o&&lname(o)!==lname(l)?`<div class="mu">statt <s>${esc(lname(o))}</s></div>`:""}${l.comment?`<div class="mu">${esc(l.comment)}</div>`:""}</div></div>`;
}
async function timetable(){
  load();
  const now=new Date(),dow=(now.getDay()+6)%7;
  const mon=new Date(now);mon.setDate(now.getDate()-dow+weekOff*7);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  try{
    const t=await api_.timetable(iso(mon),iso(fri));
    ttL=(t.lessons||[]).sort((x,y)=>x.begins_at-y.begins_at);
    if(selDay===null)selDay=weekOff===0?Math.min(dow,4):0;
    drawTT(mon,t.last_updated_at);
  }catch(e){fail(e);}
}
function blockHtml(c,a,P){
  const l=c.l,t=sh(l,"teachers"),r=sh(l,"bookables");
  return `<div class="blk ${l.kind||""}" data-i="${c.ix}" style="--c:${lcol(l)};top:${(c.s-a)*P}px;height:${Math.max((c.e-c.s)*P-2,24)}px;left:${c.lane*100/c.n}%;width:calc(${100/c.n}% - 2px)"><b>${esc(lname(l))}</b>${l.comment?`<span class="qd">${ic("info")}</span>`:""}<span>${esc(t)}</span><span>${esc(r)}</span></div>`;
}
function drawTT(mon,upd){
  const now=new Date(),mins=t=>{const d=new Date(t*1000);return d.getHours()*60+d.getMinutes()};
  const days=["MO","DI","MI","DO","FR"].map((n,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const all=[],ls=[];
    ttL.forEach((l,ix)=>{if(new Date(l.begins_at*1000).toDateString()===d.toDateString())(isAllDay(l)?all:ls).push({l,ix,s:mins(l.begins_at),e:mins(l.ends_at)});});
    return{n,d,all,ls};});
  const L=days.flatMap(x=>x.ls);
  let a=L.length?Math.min(...L.map(c=>c.s)):480,b=L.length?Math.max(...L.map(c=>c.e)):900;
  a=Math.floor(a/60)*60;b=Math.ceil(b/60)*60;const P=1.15,H=(b-a)*P;
  const ticks=[];for(let m=a;m<=b;m+=60)ticks.push(`<div class="tk" style="top:${(m-a)*P}px">${String(m/60).padStart(2,"0")}:00</div>`);
  const col=x=>{
    const it=x.ls.slice().sort((p,q)=>p.s-q.s),out=[];let cl=[],end=0,lanes=[];
    const flush=()=>{const n=Math.max(...cl.map(c=>c.lane))+1;cl.forEach(c=>{c.n=n;out.push(c);});cl=[];lanes=[];end=0;};
    it.forEach(c=>{if(cl.length&&c.s>=end)flush();let k=lanes.findIndex(e=>e<=c.s);if(k<0){k=lanes.length;lanes.push(0);}lanes[k]=c.e;c.lane=k;cl.push(c);end=Math.max(end,c.e);});
    if(cl.length)flush();
    return out.map(c=>blockHtml(c,a,P)).join("");
  };
  const anyAll=days.some(x=>x.all.length);
  V(`<div class="row" style="justify-content:space-between"><h2>Stundenplan</h2><div class="row"><button class="btn ghost" id="pw_">${ic("left")}</button><button class="btn ghost" id="cw">Heute</button><button class="btn ghost" id="nw">${ic("right")}</button></div></div>
  <div class="gw"><div class="gh"><div class="gx"></div>${days.map(x=>`<div class="gd ${x.d.toDateString()===now.toDateString()?"today":""}"><small>${x.n}</small><b>${String(x.d.getDate()).padStart(2,"0")}</b></div>`).join("")}</div>
  ${anyAll?`<div class="gh"><div class="gx mu" style="font-size:10px">ganztägig</div>${days.map(x=>`<div>${x.all.map(c=>`<div class="ad" data-i="${c.ix}" style="--c:${(KIND[c.l.kind]||[])[1]||lcol(c.l)}">${esc(lname(c.l))}</div>`).join("")}</div>`).join("")}</div>`:""}
  <div class="gb" style="height:${H}px;--hp:${60*P}px"><div class="gx">${ticks.join("")}</div>${days.map(x=>`<div class="gc">${col(x)}</div>`).join("")}</div></div>
  <p class="mu">Stand: ${esc(upd?new Date(upd).toLocaleString("de-DE"):"")}</p>`);
  $("#pw_").onclick=()=>{weekOff--;timetable();};$("#nw").onclick=()=>{weekOff++;timetable();};$("#cw").onclick=()=>{weekOff=0;timetable();};
}
/* Bottom Sheet */

const srow=(i,l,v)=>v?`<div class="srow">${ic(i)}<div><div class="mu">${l}</div>${v}</div></div>`:"";

    srow("clock","Zeit",`${isAllDay(l)?"Ganztägig · ":""}${fmtT(l.begins_at)} – ${fmtT(l.ends_at)}${l.meta?.displayname_hour?" · "+esc(l.meta.displayname_hour):""}`)+
    srow("user",l.kind==="SUBSTITUTION"?"Vertretung durch":"Lehrkraft",tn(l)||"–")+

    srow("info","Hinweis",esc([l.comment,l.meta?.moved_comment].filter(Boolean).join(" · ")))+

/* CHATS */
const ini=n=>(String(n).match(/[A-Za-zÄÖÜäöü]{2}/)||["?"])[0].toUpperCase();
async function chats(){
  load();
  const q=sessionStorage.getItem("cq")||"";
  try{
    const list=await api_.chats(1,q);
    V(`<h2>Chats</h2><input id="cs" placeholder="Suchen …" value="${esc(q)}">`+
      (list.map(c=>{const n=c.meta?.displayname||c.code;return `<div class="crow chat" data-c="${c.chat?.id||c.id}" data-ch="${c.id}" data-p="${c.chat?.can?.["post-message"]===0?0:1}" data-n="${esc(n)}"><div class="av">${ini(n)}</div><div><b>${esc(n)}</b><div class="mu">${c.users_count||""} Teilnehmer</div></div></div>`;}).join("")||'<p class="mu">Keine Chats.</p>'));
    $("#cs").onchange=e=>{sessionStorage.setItem("cq",e.target.value);chats();};
    document.querySelectorAll(".chat").forEach(el=>el.onclick=()=>openChat(el.dataset.c,el.dataset.p==="1",el.dataset.n,el.dataset.ch));
  }catch(e){fail(e);}
}
function newsCard(n){
  if(n&&n.title)return `<div class="shared">${ic("news")} <b>${esc(n.title)}</b><div class="nbody">${n.content_rendered?clean(n.content_rendered):esc(n.content)}</div>${attHtml(n.attachments)}</div>`;
  if(n&&n.id)return `<div class="shared" data-nid="${n.id}"><span class="mu">Lade News …</span></div>`;
  return `<div class="shared">${ic("news")} <b>News nicht mehr verfügbar</b><br><span class="mu">Sie wurde gelöscht oder du hast keinen Zugriff.</span></div>`;
}
const HINTS={"news.posted":"hat eine News geteilt"};
function msgHtml(x,mine){
  if(x.deleted_at||x.unset_at)return `<div class="del ${mine?"me":""}">Diese Nachricht wurde gelöscht</div>`;
  let b="";
  if(x.target_type==="news"||x.content==="news.posted")b=newsCard(x.target);
  else if(x.type==="HINT"||/^[a-z_]+(\.[a-z_]+)+$/.test(x.content||""))b=`<i>${esc(HINTS[x.content]||x.content)}</i>`;
  else b=esc(x.content||"");
  const f=x.file,m=f?.meta||{};
  if(f)b+=(m.has_image||f.file_type==="image"||/^(jpe?g|png|gif|webp)$/i.test(f.extension||""))?`<img class="nimg" data-src="${esc(m.content_uri||m.uri||m.thumbnail_uri)}" alt="${esc(f.name)}">`:`<div><a href="#" data-dl="${esc(m.download_uri||m.uri)}" data-name="${esc(f.name)}">${ic("clip")} ${esc(f.name)}</a></div>`;
  const t=new Date(x.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  return `<div class="msg ${mine?"me":""}">${mine?"":`<div class="who">${esc(x.user?.meta?.displayname||"")}</div>`}${b}<div class="tm">${t}</div></div>`;
}
let CH=null;
async function openChat(id,canPost=true,name="Chat",ch=null){
  CH={id,canPost,name,ch:ch||id,msgs:[],page:1,file:null};
  load();document.body.classList.add("inchat");
  try{CH.msgs=await api_.msgs(id,1);drawChat(true);}catch(e){fail(e);}
}
function drawChat(scroll){
  const keep=document.querySelector("#mi")?.value||"";
  const m=CH.msgs.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let last="",un=false,h="";
  m.forEach(x=>{
    const d=new Date(x.created_at),dl=d.toLocaleDateString("de-DE",{day:"2-digit",month:"long"}),mine=x.user?.id===me.id;
    if(dl!==last){h+=`<div class="dsep"><span>${dl}</span></div>`;last=dl;}
    if(!un&&x.is_read===false&&!mine){un=true;h+=`<div class="dsep un"><span>Ungelesene Nachrichten</span></div>`;}
    h+=msgHtml(x,mine);
  });
  V(`<div class="chead"><button class="ib" id="bk">${ic("left")}</button><div class="av">${ini(CH.name)}</div><div class="ct" id="ci"><b>${esc(CH.name)}</b><div class="mu">Hier klicken für Chat Info</div></div></div>
  <button class="btn ghost" id="older" style="display:block;margin:6px auto 10px">Ältere Nachrichten laden</button><div id="ms">${h}</div>
  ${CH.canPost?`<div id="fchip"></div><div class="cin"><button class="ib pl" id="plus">${ic("plus")}</button><input type="file" id="fi" hidden><input id="mi" placeholder="Neue Nachricht"><button class="ib pl" id="sd">${ic("send")}</button></div>`:`<div class="card mu">${ic("lock")} Einweg-Chat: Hier können nur Admins schreiben.</div>`}`);
  if(keep&&$("#mi"))$("#mi").value=keep;
  $("#bk").onclick=chats;
  $("#older").onclick=async()=>{try{const o=await api_.msgs(CH.id,CH.page+1);if(!o.length){$("#older").remove();return;}CH.page++;const ids=new Set(CH.msgs.map(x=>x.uuid));CH.msgs=CH.msgs.concat(o.filter(x=>!ids.has(x.uuid)));drawChat(false);}catch(e){alert(e.message);}};
  $("#ci").onclick=chatInfo;
  document.querySelectorAll("[data-nid]").forEach(async el=>{try{el.outerHTML=newsCard(await api_.newsById(el.dataset.nid));}catch(_){el.outerHTML=newsCard(null);}});
  if(CH.canPost){
    const chip=()=>{$("#fchip").innerHTML=CH.file?`<div class="fchip">${ic("clip")} <span>${esc(CH.file.name)}</span><button class="ib" id="fx">${ic("x")}</button></div>`:"";if(CH.file)$("#fx").onclick=()=>{CH.file=null;chip();};};
    $("#plus").onclick=()=>$("#fi").click();
    $("#fi").onchange=e=>{CH.file=e.target.files[0]||null;chip();};chip();
    const send=async()=>{
      const v=$("#mi").value.trim();if(!v&&!CH.file)return;
      try{
        let body={content:v};
        if(CH.file){body=new FormData();body.append("content",v);body.append("file",CH.file);}
        await api(`channels/chats/${CH.id}/messages`,{method:"POST",body});
        CH.file=null;CH.page=1;CH.msgs=await api_.msgs(CH.id,1);drawChat(true);
      }catch(e){alert("Senden fehlgeschlagen: "+e.message);}
    };
    $("#sd").onclick=send;$("#mi").onkeydown=e=>e.key==="Enter"&&send();
  }
  if(scroll)window.scrollTo(0,document.body.scrollHeight);
}
async function chatInfo(){
  $("#sh-c").innerHTML=`<h3 style="margin:0 0 8px">${esc(CH.name)}</h3><p class="mu">Lade Teilnehmer …</p>`;$("#sheet").classList.add("open");
  try{
    const r=await api_.members(CH.ch);
    $("#sh-c").innerHTML=`<h3 style="margin:0 0 8px">${esc(CH.name)}</h3><div class="mu">${r.length} Teilnehmer (erste Seite)</div>`+r.map(u=>{const n=u.meta?.displayname||u.user?.meta?.displayname||`${u.firstname||""} ${u.lastname||""}`.trim()||"Unbekannt";return `<div class="srow" style="align-items:center"><div class="av" style="width:34px;height:34px;font-size:13px">${ini(n)}</div><div>${esc(n)}<div class="mu">${esc(u.meta?.subtitle||u.type||"")}</div></div></div>`;}).join("");
  }catch(e){$("#sh-c").innerHTML=`<h3>${esc(CH.name)}</h3><p class="err">${esc(e.message)}</p>`;}
}

/* CLOUD */
let cl={id:null,name:"",path:"",stack:[]};
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
async function cloud(){
  load();
  try{
    if(!cl.id){
      const list=(await api_.chats(1,"",50)).filter(c=>c.cloud?.id||c.cloud_id);
      V(`<h2>Cloud</h2><p class="mu">Wähle den Kanal, dessen Dateien du sehen willst.</p>`+(list.map(c=>{const n=c.meta?.displayname||c.code;return `<div class="crow" data-cl="${c.cloud?.id||c.cloud_id}" data-n="${esc(n)}"><div class="av">${ic("cloud")}</div><div><b>${esc(n)}</b></div></div>`;}).join("")||'<p class="mu">Keine Clouds gefunden.</p>'));
      document.querySelectorAll("[data-cl]").forEach(el=>el.onclick=()=>{cl={id:el.dataset.cl,name:el.dataset.n,path:"",stack:[]};cloud();});
      return;
    }
    const q=sessionStorage.getItem("fq")||"";
    const fl=await api_.files(cl.id,cl.path||undefined,q||undefined);
    V(`<div class="row"><button class="ib" id="cb_">${ic("left")}</button><h2 style="margin:0">${esc(cl.name)}</h2></div><div class="mu" style="margin:4px 0 10px">/${esc(cl.path)}</div><input id="fs" placeholder="Dateien suchen …" value="${esc(q)}">`+
      (fl.map((f,i)=>{const m=f.meta||{},dir=f.file_type==="folder"||f.type==="folder"||f.type==="directory";
        const th=m.has_image&&(m.thumbnail_uri||m.content_uri);
        return `<div class="crow" data-f="${i}"><div class="av" style="border-radius:12px;overflow:hidden">${th?`<img data-src="${esc(th)}" style="width:100%;height:100%;object-fit:cover">`:ic(dir?"folder":"file")}</div><div style="min-width:0"><b style="word-break:break-word">${esc(f.name)}</b><div class="mu">${dir?"Ordner":fsize(f.size||0)} · ${new Date(f.updated_at).toLocaleDateString("de-DE")}</div></div></div>`;}).join("")||'<p class="mu">Keine Dateien.</p>'));
    $("#cb_").onclick=()=>{if(cl.stack.length){cl.path=cl.stack.pop();}else cl.id=null;cloud();};
    $("#fs").onchange=e=>{sessionStorage.setItem("fq",e.target.value);cloud();};
    document.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{
      const f=fl[+el.dataset.f],m=f.meta||{};
      if(f.file_type==="folder"||f.type==="folder"||f.type==="directory"){cl.stack.push(cl.path);cl.path=m.absolute_path||f.path||f.name;cloud();}
      else dlFile(m.download_uri||m.uri||m.content_uri,f.name);
    });
  }catch(e){fail(e);}
}
